name: navika
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.2.3+2.2.3
environment:
  sdk: '>=2.16.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  localization: ^2.1.0

  cupertino_icons: ^2.0.0
  google_mobile_ads: ^9.1.0
  url_launcher: ^6.0.6
  provider: ^6.1.5+1
  shared_preferences: ^2.0.13

  nrs_flutter_lib:
    path: ../nrs-flutter-lib

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # flutter pub run flutter_launcher_icons:main
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.19

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/banners/
    - lib/i18n/

flutter_intl:
  enabled: true

# flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: true
  # logo_512.png must have the alpha channel removed using Gimp or PhotoShop
  image_path_android: assets/icon/logo_512.png
  image_path_ios: assets/icon/logo_512.png
  adaptive_icon_background: assets/icon/ic_background.png
  adaptive_icon_foreground: assets/icon/ic_foreground.png

# flutter clean && flutter pub get && flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: '#1f96f3'
  image: assets/splash.png
  color_dark: '#1f96f3'
  android: true
  ios: true
# Commands:
# Build deployable IOS:         flutter build ipa --release
# Build deployable Android:     flutter build appbundle --release
# Build debug installable IOS:  flutter build ios --release
# Install on phone:             flutter install
